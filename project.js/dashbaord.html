<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AuthFlow</title>
    <link rel="stylesheet" href="dashbaord.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="welcome-msg">
                <h1>Welcome back, <span id="userName">User</span>! 👋</h1>
                <p>Here's your account overview</p>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>

        <!-- User Info Card -->
        <div class="info-card">
            <div class="avatar" id="userAvatar">U</div>
            <div class="user-details">
                <h2 id="userFullName">Username</h2>
                <p id="userEmail">email@example.com</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👤</div>
                <div class="stat-info">
                    <p class="stat-label">Username</p>
                    <p class="stat-value" id="statUsername">-</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📧</div>
                <div class="stat-info">
                    <p class="stat-label">Email</p>
                    <p class="stat-value" id="statEmail">-</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🎂</div>
                <div class="stat-info">
                    <p class="stat-label">Age</p>
                    <p class="stat-value" id="statAge">-</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🕐</div>
                <div class="stat-info">
                    <p class="stat-label">Last Login</p>
                    <p class="stat-value" id="statLogin">-</p>
                </div>
            </div>
        </div>

    </div>

    <script src="dashboard.js"></script>
    <script src="storage.js"></script>

</body>

</html>
