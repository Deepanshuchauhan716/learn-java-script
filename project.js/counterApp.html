<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container{
            border-radius: 20px;
            height:300px;
            width:400px;
            border: 1px solid black;
            background-color: rgb(8, 93, 93);
        }

        .btn{
             height:40px;
             width: 100px;
             position: relative;    
             top:60px;
             left:80px;
             margin-right: 30px;
             border-radius: 30px;
             border: none;
             font-size: 30px;
             background-color: rgb(255, 255, 255);
        }
        .btn:focus{
            border:2px solid black;
        }

        #count{
            color: rgb(255, 145, 145);
            position: relative;
            top:100px;
            left:190px;
        }

        #inp{
            padding: 10px;
            position: relative;
            top:120px;
            height:10px;
            left:110px;
            font-weight: bold;
            color:black
        }
        
        #inp::placeholder{
            color: rgb(72, 58, 58);
        }

        #reset{
            border-radius: 30px;
            border: none;
            position: relative;
            top:170px;
            width:170px;
            height:30px;
            /* left:110px; */
            right:75px;
            color:black
        }

        #reset:focus{
            border:1px solid black;
        }
    </style>
</head>
<body style="background-color: rgb(91, 207, 207);">
    <div id="container">
        <button class="btn">+</button>
        <button class="btn">-</button>

        <h1 id="count">0</h1>
        <input type="text" id="inp" placeholder="Increment/Decremet By">
        <button id="reset">Reset</button>
    </div>
</body>
<script src="counterApp.js"></script>
</html>
