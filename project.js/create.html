<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create acc</title>
    <link rel="stylesheet" href="create.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>
    <form action="" class="login-form" id="signup_form">
        <div class="container">
            <div class="acc-create">Create your account</div>
            <div class="auth-child">Join authFlow today</div>

            <div class="group-par">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder=" ">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder=" ">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder=" ">
                </div>
                <div class="form-group">
                    <label for="conforim">Confirm password</label>
                    <input type="password" id="conforim" name="conforim" placeholder=" ">
                </div>
                <div class="form-group specific">
                    <button class="create-btn" type="submit">Create account</button>
                </div>
                <div class="form-group acc">
                    <div class="already-acc">Already hava an account?<span><a href="login.html">Login</a></span></div>
                </div>
            </div>
        </div>
    </form>
    <script src="create.js"></script>
    <script src="storage.js"></script>
</body>

</html>
