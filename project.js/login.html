<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-page</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <form action="" class="login-form">
        <div class="container">
            <div class="welcome-div">
                <div class="welcome-text">Welcome Back</div>
            </div>
            <div class="Login-text">
                <div class="text-child">Login to continue to your account</div>
            </div>

            <div class="formGroup-par">
                <div class="form-grp">
                    <label for="username">Username Or Email</label>
                    <input type="text" id="username">
                </div>
                <div class="form-grp">
                    <label for="password">Password</label>
                    <input type="text" id="password">
                </div>
            </div>
            <div class="check-forget">
                <div class="rem-wrap">
                    <input type="checkbox" name="checkbox" id="checkbox">
                    <label for="checkbox" class="Remember">Remember me</label>
                </div>
                <a href="#forget-pass">Forget Password?</a>
            </div>
            <div class="btn-par">
                <button class="login-btn">Login</button>
            </div>
            <div class="form-group acc">
                <div class="already-acc">Don`t have an account?<span><a href="#login">Create account</a></span></div>
            </div>
        </div>
    </form>
    <script src="storage.js"></script>
</body>

</html>
